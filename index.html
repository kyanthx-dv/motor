<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Mini Futebol · Núcleo da Engine</title>
<link rel="stylesheet" href="games/futebol/estilo.css"></head><body>
<div id="jogo">
  <canvas id="tela"></canvas>
  <div class="placar" id="placar">0  ×  0</div>
  <div class="flash" id="flash" hidden>GOL!</div>
  <div class="aviso" id="aviso" hidden></div>
  <div class="dica">Setas ou WASD movem. Espaço chuta. No celular, arraste na tela e use o botão Chutar.</div>
  <button class="chute" id="b-chute" type="button">Chutar</button>
  <div class="barra">
    <button id="b-reiniciar" type="button">Reiniciar</button>
    <button id="b-pausar" type="button">Pausar</button>
    <button id="b-salvar" type="button">Salvar</button>
    <button id="b-carregar" type="button">Carregar</button>
    <button id="b-debug" type="button">Colisores</button>
  </div>
</div>
<script src="core/events.js"></script>
<script src="core/scene.js"></script>
<script src="core/serializer.js"></script>
<script src="core/systems/controles.js"></script>
<script src="core/systems/scripts.js"></script>
<script src="core/systems/fisica.js"></script>
<script src="core/systems/animacao.js"></script>
<script src="core/systems/camera.js"></script>
<script src="core/engine.js"></script>
<script src="adapters/canvas-renderer.js"></script>
<script src="adapters/input.js"></script>
<script src="games/futebol/jogo.js"></script>
</body></html>
