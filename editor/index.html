<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Editor do Motor</title>
<link rel="stylesheet" href="../editor/editor.css"></head><body>
<header class="topo"><b>Editor do Motor</b><span class="sub">E2 · mover, criar, remover, duplicar</span>
  <div class="acoes" aria-label="Ações do editor"><button type="button" id="e-criar">Criar</button><button type="button" id="e-duplicar" disabled>Duplicar</button><button type="button" id="e-remover" disabled>Remover</button><button type="button" id="e-play">Play</button><button type="button" id="e-parar" disabled>Parar</button><button type="button" id="e-desfazer" disabled>Desfazer</button><button type="button" id="e-refazer" disabled>Refazer</button><button type="button" id="e-jogar">Tela cheia</button></div>
  <label class="chk"><input type="checkbox" id="c-col"> Colisores</label></header>
<main class="grade">
  <section class="painel" aria-label="Objetos"><section class="projetos" aria-label="Projetos"><h2>Projetos</h2><select id="projetos" size="4" aria-label="Projetos salvos"></select><div class="linha"><input id="projeto-nome" placeholder="nome do projeto" aria-label="Nome do projeto"><button type="button" id="projeto-criar">Novo</button></div><div class="linha"><button type="button" id="projeto-abrir">Abrir</button><button type="button" id="projeto-renomear">Renomear</button><button type="button" id="projeto-apagar">Apagar</button></div><div class="linha"><button type="button" id="p-exemplo">Abrir exemplo: Pega-moedas</button></div><div class="linha"><button type="button" id="projeto-baixar">Baixar</button><button type="button" id="projeto-abrir-arquivo">Abrir arquivo</button><input id="projeto-arquivo" type="file" accept="application/json,.json" hidden></div></section><section class="projetos" aria-label="Cenas"><h2>Cenas <small id="n-cenas"></small></h2><select id="cenas-lista" size="3" aria-label="Cenas do projeto"></select><div class="linha"><input id="cena-nome" placeholder="nome da cena" aria-label="Nome da cena"><button type="button" id="cena-nova">Nova</button></div><div class="linha"><button type="button" id="cena-abrir">Abrir</button><button type="button" id="cena-renomear">Renomear</button><button type="button" id="cena-apagar">Apagar</button></div></section><h2>Objetos <small id="n-obj"></small></h2><div class="linha"><button type="button" id="e-texto">Novo texto</button><button type="button" id="e-botao">Novo botão</button></div><ul id="lista" class="lista"></ul></section>
  <section class="centro"><div class="palco"><canvas id="tela"></canvas></div><div class="status" id="status">Clique em um objeto para selecionar.</div>
    <section class="painel scripts" aria-label="Scripts"><h2>Scripts <small id="n-sc"></small></h2>
      <div id="sc-aviso" class="aviso" role="alert" hidden></div>
      <div class="linha"><select id="sc-lista" aria-label="Scripts do projeto"></select><input id="sc-nome" placeholder="nome do novo script" aria-label="Nome do novo script"><button type="button" id="sc-novo-b">Novo (blocos)</button><button type="button" id="sc-novo">Novo (código)</button></div>
      <div id="bl" class="blocos" hidden></div>
      <textarea id="sc-fonte" class="codigo" spellcheck="false" maxlength="50000" aria-label="Código do script (JavaScript)" placeholder="Crie um script para escrever o código."></textarea>
      <div id="sc-msg" class="msg" role="status"></div>
      <div class="linha"><button type="button" id="sc-conv" hidden>Converter em código (sem volta)</button><button type="button" id="sc-anexar">Anexar ao objeto selecionado</button><button type="button" id="sc-desanexar">Desanexar</button><button type="button" id="sc-remover">Remover script</button></div>
      <div id="sc-info" class="status"></div></section></section>
  <section class="painel" aria-label="Propriedades"><h2>Propriedades</h2><div id="props" class="props"></div>
    <section id="camera" class="camera" aria-label="Câmera"><h2>Câmera</h2><div class="campo"><label for="cam-x">x</label><input id="cam-x" type="number" step="any"></div><div class="campo"><label for="cam-y">y</label><input id="cam-y" type="number" step="any"></div><div class="campo"><label for="cam-zoom">zoom</label><input id="cam-zoom" type="number" min="0.05" step="any"></div><div class="campo"><label for="cam-suavizar">suavizar</label><input id="cam-suavizar" type="number" min="0" step="any"></div><div class="campo"><label for="cam-seguir">seguir</label><select id="cam-seguir"></select></div><h2>Limites</h2><div class="camera-limites"><input id="cam-x0" type="number" step="any" placeholder="x0"><input id="cam-y0" type="number" step="any" placeholder="y0"><input id="cam-x1" type="number" step="any" placeholder="x1"><input id="cam-y1" type="number" step="any" placeholder="y1"></div><div class="linha"><button type="button" id="cam-aplicar">Aplicar</button><button type="button" id="cam-limpar">Fixa</button></div><div id="cam-msg" class="msg" role="status"></div></section>
    <h2>Variáveis <small id="n-var"></small></h2><div id="vars" class="vars"></div>
    <form id="nova-var" class="nv"><input id="nv-nome" placeholder="nome" aria-label="Nome da variável"><select id="nv-tipo" aria-label="Tipo"><option value="numero">número</option><option value="texto">texto</option><option value="booleano">verdadeiro/falso</option></select><input id="nv-val" placeholder="valor inicial" aria-label="Valor inicial"><button type="submit">Criar</button></form>
    <div id="msg" class="msg" role="status"></div><div id="obs" class="msg" role="status" hidden></div>
    <details class="json"><summary>Cena em JSON</summary><textarea id="json" spellcheck="false" aria-label="Cena em JSON"></textarea>
      <div class="linha"><button type="button" id="j-ler">Atualizar do editor</button><button type="button" id="j-aplicar">Aplicar JSON</button></div></details>
  </section>
</main>
<button type="button" id="e-sair-jogar" class="sair-jogar">Sair do jogo</button>
<script src="../core/events.js"></script><script src="../core/scene.js"></script><script src="../core/variaveis.js"></script><script src="../core/serializer.js"></script>
<script src="../core/systems/controles.js"></script><script src="../core/systems/ui.js"></script><script src="../core/systems/scripts.js"></script><script src="../core/systems/fisica.js"></script><script src="../core/systems/animacao.js"></script><script src="../core/systems/camera.js"></script>
<script src="../core/engine.js"></script><script src="../adapters/assets.js"></script><script src="../adapters/audio.js"></script><script src="../adapters/canvas-renderer.js"></script><script src="../adapters/input.js"></script>
  <script src="editor.js"></script><script src="camera.js"></script>
  <script src="cenas.js"></script><script src="arquivos.js"></script><script src="gerador.js"></script><script src="exemplos.js"></script><script src="blocos-ui.js"></script><script src="scripts.js"></script>
</body></html>
